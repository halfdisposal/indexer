[package]
name = "indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
pdftext = { path = "./pdftext" }
colored = { path = "C:/Users/bikas/OneDrive/Documents/Codes/Misc/Packages/colored" }
serde = { version = "1", features = ["derive"] }
bincode = { path = "C:/Users/bikas/OneDrive/Documents/Codes/Misc/Packages/bincode", features = ["serde"] }
glob = { path = "C:/Users/bikas/OneDrive/Documents/Codes/Misc/Packages/glob" }
rsparse = { path = "C:/Users/bikas/OneDrive/Documents/Codes/Misc/Packages/rsparse" }
argp = { path = "C:/Users/bikas/OneDrive/Documents/Codes/Misc/Packages/argp/argp" }
serde_json = "1"
rayon = "1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = true
incremental = false
